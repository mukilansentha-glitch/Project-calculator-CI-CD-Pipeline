
sonar.projectKey=flask-devops-app
sonar.projectName=Flask DevOps Calculator
sonar.projectVersion=1.0

# Source & test paths
sonar.sources=.
sonar.inclusions=app.py
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Python language
sonar.language=py
sonar.python.version=3.11

# Coverage report (generated by pytest-cov in Jenkinsfile)
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate — pipeline will fail if gate is not passed
sonar.qualitygate.wait=true
